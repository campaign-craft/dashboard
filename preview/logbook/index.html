<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Logbook Freelance</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <strong>Logbook Freelance</strong>
    <span class="spacer"></span>
    <button class="btn" id="btn-export" type="button">Export JSON</button>
    <button class="btn" id="btn-import" type="button">Import JSON</button>
    <input type="file" id="file-import" accept="application/json,.json" hidden>
  </header>

  <div class="layout">
    <aside class="sidebar">
      <div class="side-tools">
        <input id="search" type="search" placeholder="Cari klien" aria-label="Cari klien">
        <button class="btn primary" id="btn-add-client" type="button">Tambah klien</button>
      </div>
      <nav id="client-list" aria-label="Daftar klien"></nav>
    </aside>
    <main id="detail" aria-live="polite"></main>
  </div>

  <dialog id="modal"></dialog>
  <div id="toast" role="status"></div>

  <!-- Urutan penting: storage dulu, lalu seed, lalu app. Tanpa ES module supaya jalan lewat file:// -->
  <script src="storage.js"></script>
  <script src="seed.js"></script>
  <script src="app.js"></script>
</body>
</html>
