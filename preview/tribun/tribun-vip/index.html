<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tribun VIP - Logo Visual Preview</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Inter & FontAwesome Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    },
                    colors: {
                        tribun: {
                            blue: '#0073C6',
                            navy: '#12396C',
                            dark: '#0D213A',
                            light: '#F4F7FA'
                        }
                    }
                }
            }
        }
    </script>

    <style>
        /* Transparency Checkerboard Pattern */
        .bg-checkerboard {
            background-color: #ffffff;
            background-image: linear-gradient(45deg, #e2e8f0 25%, transparent 25%), 
                              linear-gradient(-45deg, #e2e8f0 25%, transparent 25%), 
                              linear-gradient(45deg, transparent 75%, #e2e8f0 75%), 
                              linear-gradient(-45deg, transparent 75%, #e2e8f0 75%);
            background-size: 20px 20px;
            background-position: 0 0, 0 10px, 10px -10px, -10px 0px;
        }

        .bg-checkerboard-dark {
            background-color: #0f172a;
            background-image: linear-gradient(45deg, #1e293b 25%, transparent 25%), 
                              linear-gradient(-45deg, #1e293b 25%, transparent 25%), 
                              linear-gradient(45deg, transparent 75%, #1e293b 75%), 
                              linear-gradient(-45deg, transparent 75%, #1e293b 75%);
            background-size: 20px 20px;
            background-position: 0 0, 0 10px, 10px -10px, -10px 0px;
        }

        .custom-scrollbar::-webkit-scrollbar {
            width: 6px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: #f1f1f1;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 4px;
        }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 font-sans antialiased min-h-screen flex flex-col justify-between">

    <!-- Header Section -->
    <header class="bg-white border-b border-slate-200 sticky top-0 z-30 shadow-sm">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-4">
            <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-4">
                <!-- Brand / Project Title -->
                <div class="flex items-center space-x-3">
                    <div class="w-10 h-10 rounded-xl bg-tribun-blue text-white flex items-center justify-center font-bold text-xl shadow-md shadow-blue-500/20">
                        TV
                    </div>
                    <div>
                        <h1 class="text-xl font-bold text-slate-900">Tribun VIP</h1>
                        <p class="text-xs text-slate-500">Logo Preview &amp; Visual Comparison</p>
                    </div>
                </div>

                <!-- View Mode Switcher -->
                <div class="flex items-center bg-slate-100 p-1 rounded-xl border border-slate-200">
                    <button onclick="switchView('side')" id="view-btn-side" class="px-3.5 py-1.5 rounded-lg text-xs font-semibold transition bg-white text-slate-800 shadow-sm">
                        <i class="fa-solid fa-arrows-split-up-and-left mr-1.5"></i> Side by Side
                    </button>
                    <button onclick="switchView('opt1')" id="view-btn-opt1" class="px-3.5 py-1.5 rounded-lg text-xs font-semibold text-slate-600 hover:text-slate-900 transition">
                        Option 1 Detail
                    </button>
                    <button onclick="switchView('opt2')" id="view-btn-opt2" class="px-3.5 py-1.5 rounded-lg text-xs font-semibold text-slate-600 hover:text-slate-900 transition">
                        Option 2 Detail
                    </button>
                </div>
            </div>
        </div>
    </header>

    <!-- Main Content Container -->
    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 w-full flex-grow">

        <!-- SIDE BY SIDE VIEW (DEFAULT) -->
        <div id="view-side-container" class="space-y-8">
            
            <!-- White Background Row -->
            <div class="bg-white rounded-2xl border border-slate-200 p-6 shadow-sm">
                <h3 class="text-xs font-bold text-slate-400 uppercase tracking-wider mb-4">1. Light Background</h3>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div class="bg-white border border-slate-200 p-8 rounded-xl flex flex-col items-center justify-center min-h-[160px] cursor-pointer group relative overflow-hidden"
                         onclick="openLightbox('logo/logo-1.svg', 'Option 1 - Light Background', 'bg-white')">
                        <img src="logo/logo-1.svg" class="max-h-24 max-w-full object-contain mb-3 transition-transform duration-300 group-hover:scale-105" onerror="this.onerror=null; this.src='data:image/svg+xml;utf8,<svg xmlns=\'http://www.w3.org/2000/svg\' width=\'200\' height=\'60\'><rect width=\'200\' height=\'60\' fill=\'%23fff\'/><text x=\'50%\' y=\'50%\' font-size=\'12\' fill=\'%230073C6\' text-anchor=\'middle\'>logo-1.svg</text></svg>';">
                        <span class="text-xs font-semibold text-slate-500">Option 1</span>
                    </div>
                    <div class="bg-white border border-slate-200 p-8 rounded-xl flex flex-col items-center justify-center min-h-[160px] cursor-pointer group relative overflow-hidden"
                         onclick="openLightbox('logo/logo-2.svg', 'Option 2 - Light Background', 'bg-white')">
                        <img src="logo/logo-2.svg" class="max-h-24 max-w-full object-contain mb-3 transition-transform duration-300 group-hover:scale-105" onerror="this.onerror=null; this.src='data:image/svg+xml;utf8,<svg xmlns=\'http://www.w3.org/2000/svg\' width=\'200\' height=\'60\'><rect width=\'200\' height=\'60\' fill=\'%23fff\'/><text x=\'50%\' y=\'50%\' font-size=\'12\' fill=\'%2312396C\' text-anchor=\'middle\'>logo-2.svg</text></svg>';">
                        <span class="text-xs font-semibold text-slate-500">Option 2</span>
                    </div>
                </div>
            </div>

            <!-- Dark Navy Background Row -->
            <div class="bg-white rounded-2xl border border-slate-200 p-6 shadow-sm">
                <h3 class="text-xs font-bold text-slate-400 uppercase tracking-wider mb-4">2. Dark Background</h3>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div class="bg-tribun-navy border border-slate-800 p-8 rounded-xl flex flex-col items-center justify-center min-h-[160px] cursor-pointer group relative overflow-hidden"
                         onclick="openLightbox('logo/logo-1-white.svg', 'Option 1 - Dark Background', 'bg-tribun-navy')">
                        <img src="logo/logo-1-white.svg" class="max-h-24 max-w-full object-contain mb-3 transition-transform duration-300 group-hover:scale-105" onerror="this.onerror=null; this.src='data:image/svg+xml;utf8,<svg xmlns=\'http://www.w3.org/2000/svg\' width=\'200\' height=\'60\'><rect width=\'200\' height=\'60\' fill=\'%2312396C\'/><text x=\'50%\' y=\'50%\' font-size=\'12\' fill=\'%23fff\' text-anchor=\'middle\'>logo-1-white.svg</text></svg>';">
                        <span class="text-xs font-semibold text-slate-300">Option 1</span>
                    </div>
                    <div class="bg-tribun-navy border border-slate-800 p-8 rounded-xl flex flex-col items-center justify-center min-h-[160px] cursor-pointer group relative overflow-hidden"
                         onclick="openLightbox('logo/logo-2-white.svg', 'Option 2 - Dark Background', 'bg-tribun-navy')">
                        <img src="logo/logo-2-white.svg" class="max-h-24 max-w-full object-contain mb-3 transition-transform duration-300 group-hover:scale-105" onerror="this.onerror=null; this.src='data:image/svg+xml;utf8,<svg xmlns=\'http://www.w3.org/2000/svg\' width=\'200\' height=\'60\'><rect width=\'200\' height=\'60\' fill=\'%2312396C\'/><text x=\'50%\' y=\'50%\' font-size=\'12\' fill=\'%23fff\' text-anchor=\'middle\'>logo-2-white.svg</text></svg>';">
                        <span class="text-xs font-semibold text-slate-300">Option 2</span>
                    </div>
                </div>
            </div>

            <!-- Transparent Checkerboard Row -->
            <div class="bg-white rounded-2xl border border-slate-200 p-6 shadow-sm">
                <h3 class="text-xs font-bold text-slate-400 uppercase tracking-wider mb-4">3. Transparent Canvas</h3>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div class="bg-checkerboard border border-slate-200 p-8 rounded-xl flex flex-col items-center justify-center min-h-[160px] cursor-pointer group relative overflow-hidden"
                         onclick="openLightbox('logo/logo-1.svg', 'Option 1 - Transparent Grid', 'bg-checkerboard')">
                        <img src="logo/logo-1.svg" class="max-h-24 max-w-full object-contain mb-3 transition-transform duration-300 group-hover:scale-105" onerror="this.onerror=null; this.src='data:image/svg+xml;utf8,<svg xmlns=\'http://www.w3.org/2000/svg\' width=\'200\' height=\'60\'><rect width=\'200\' height=\'60\' fill=\'%23f1f5f9\'/><text x=\'50%\' y=\'50%\' font-size=\'12\' fill=\'%230073C6\' text-anchor=\'middle\'>logo-1.svg</text></svg>';">
                        <span class="text-xs font-semibold text-slate-500">Option 1</span>
                    </div>
                    <div class="bg-checkerboard border border-slate-200 p-8 rounded-xl flex flex-col items-center justify-center min-h-[160px] cursor-pointer group relative overflow-hidden"
                         onclick="openLightbox('logo/logo-2.svg', 'Option 2 - Transparent Grid', 'bg-checkerboard')">
                        <img src="logo/logo-2.svg" class="max-h-24 max-w-full object-contain mb-3 transition-transform duration-300 group-hover:scale-105" onerror="this.onerror=null; this.src='data:image/svg+xml;utf8,<svg xmlns=\'http://www.w3.org/2000/svg\' width=\'200\' height=\'60\'><rect width=\'200\' height=\'60\' fill=\'%23f1f5f9\'/><text x=\'50%\' y=\'50%\' font-size=\'12\' fill=\'%2312396C\' text-anchor=\'middle\'>logo-2.svg</text></svg>';">
                        <span class="text-xs font-semibold text-slate-500">Option 2</span>
                    </div>
                </div>
            </div>

        </div>

        <!-- OPTION 1 DETAIL VIEW -->
        <div id="view-opt1-container" class="hidden max-w-3xl mx-auto bg-white rounded-2xl border border-slate-200 overflow-hidden shadow-sm p-6 space-y-6">
            <h2 class="text-lg font-bold text-slate-900 border-b border-slate-100 pb-3">Option 01 Details</h2>
            
            <div class="space-y-4">
                <div class="bg-white border border-slate-200 rounded-xl p-8 flex items-center justify-center cursor-pointer" onclick="openLightbox('logo/logo-1.svg', 'Option 1 - White Background', 'bg-white')">
                    <img src="logo/logo-1.svg" class="max-h-28 max-w-full object-contain" onerror="this.onerror=null; this.src='data:image/svg+xml;utf8,<svg xmlns=\'http://www.w3.org/2000/svg\' width=\'200\' height=\'60\'><rect width=\'200\' height=\'60\' fill=\'%23fff\'/><text x=\'50%\' y=\'50%\' font-size=\'12\' fill=\'%230073C6\' text-anchor=\'middle\'>logo-1.svg</text></svg>';">
                </div>
                <div class="bg-tribun-navy border border-slate-800 rounded-xl p-8 flex items-center justify-center cursor-pointer" onclick="openLightbox('logo/logo-1-white.svg', 'Option 1 - Dark Background', 'bg-tribun-navy')">
                    <img src="logo/logo-1-white.svg" class="max-h-28 max-w-full object-contain" onerror="this.onerror=null; this.src='data:image/svg+xml;utf8,<svg xmlns=\'http://www.w3.org/2000/svg\' width=\'200\' height=\'60\'><rect width=\'200\' height=\'60\' fill=\'%2312396C\'/><text x=\'50%\' y=\'50%\' font-size=\'12\' fill=\'%23fff\' text-anchor=\'middle\'>logo-1-white.svg</text></svg>';">
                </div>
                <div class="bg-checkerboard border border-slate-200 rounded-xl p-8 flex items-center justify-center cursor-pointer" onclick="openLightbox('logo/logo-1.svg', 'Option 1 - Transparent Canvas', 'bg-checkerboard')">
                    <img src="logo/logo-1.svg" class="max-h-28 max-w-full object-contain" onerror="this.onerror=null; this.src='data:image/svg+xml;utf8,<svg xmlns=\'http://www.w3.org/2000/svg\' width=\'200\' height=\'60\'><rect width=\'200\' height=\'60\' fill=\'%23f1f5f9\'/><text x=\'50%\' y=\'50%\' font-size=\'12\' fill=\'%230073C6\' text-anchor=\'middle\'>logo-1.svg</text></svg>';">
                </div>
            </div>
        </div>

        <!-- OPTION 2 DETAIL VIEW -->
        <div id="view-opt2-container" class="hidden max-w-3xl mx-auto bg-white rounded-2xl border border-slate-200 overflow-hidden shadow-sm p-6 space-y-6">
            <h2 class="text-lg font-bold text-slate-900 border-b border-slate-100 pb-3">Option 02 Details</h2>
            
            <div class="space-y-4">
                <div class="bg-white border border-slate-200 rounded-xl p-8 flex items-center justify-center cursor-pointer" onclick="openLightbox('logo/logo-2.svg', 'Option 2 - White Background', 'bg-white')">
                    <img src="logo/logo-2.svg" class="max-h-28 max-w-full object-contain" onerror="this.onerror=null; this.src='data:image/svg+xml;utf8,<svg xmlns=\'http://www.w3.org/2000/svg\' width=\'200\' height=\'60\'><rect width=\'200\' height=\'60\' fill=\'%23fff\'/><text x=\'50%\' y=\'50%\' font-size=\'12\' fill=\'%2312396C\' text-anchor=\'middle\'>logo-2.svg</text></svg>';">
                </div>
                <div class="bg-tribun-navy border border-slate-800 rounded-xl p-8 flex items-center justify-center cursor-pointer" onclick="openLightbox('logo/logo-2-white.svg', 'Option 2 - Dark Background', 'bg-tribun-navy')">
                    <img src="logo/logo-2-white.svg" class="max-h-28 max-w-full object-contain" onerror="this.onerror=null; this.src='data:image/svg+xml;utf8,<svg xmlns=\'http://www.w3.org/2000/svg\' width=\'200\' height=\'60\'><rect width=\'200\' height=\'60\' fill=\'%2312396C\'/><text x=\'50%\' y=\'50%\' font-size=\'12\' fill=\'%23fff\' text-anchor=\'middle\'>logo-2-white.svg</text></svg>';">
                </div>
                <div class="bg-checkerboard border border-slate-200 rounded-xl p-8 flex items-center justify-center cursor-pointer" onclick="openLightbox('logo/logo-2.svg', 'Option 2 - Transparent Canvas', 'bg-checkerboard')">
                    <img src="logo/logo-2.svg" class="max-h-28 max-w-full object-contain" onerror="this.onerror=null; this.src='data:image/svg+xml;utf8,<svg xmlns=\'http://www.w3.org/2000/svg\' width=\'200\' height=\'60\'><rect width=\'200\' height=\'60\' fill=\'%23f1f5f9\'/><text x=\'50%\' y=\'50%\' font-size=\'12\' fill=\'%2312396C\' text-anchor=\'middle\'>logo-2.svg</text></svg>';">
                </div>
            </div>
        </div>

    </main>

    <!-- Minimal Footer -->
    <footer class="bg-white border-t border-slate-200 mt-12 py-5">
        <div class="max-w-7xl mx-auto px-4 text-center text-xs text-slate-400">
            &copy; Tribun VIP Logo Visual Preview
        </div>
    </footer>

    <!-- LIGHTBOX / ZOOM MODAL -->
    <div id="lightboxModal" class="fixed inset-0 bg-slate-950/80 backdrop-blur-md z-50 hidden flex items-center justify-center p-4 transition-opacity duration-200" onclick="closeLightbox()">
        <div class="relative max-w-4xl w-full flex flex-col items-center" onclick="event.stopPropagation()">
            <!-- Close Button -->
            <button onclick="closeLightbox()" class="absolute -top-12 right-0 text-white/80 hover:text-white text-sm bg-white/10 hover:bg-white/20 px-3 py-1.5 rounded-lg transition">
                <i class="fa-solid fa-xmark mr-1"></i> Close
            </button>
            
            <!-- Modal Stage Container -->
            <div id="lightboxStage" class="w-full p-12 sm:p-20 rounded-2xl flex items-center justify-center shadow-2xl border border-white/10 min-h-[300px] transition-all">
                <img id="lightboxImg" src="" alt="Zoomed Logo" class="max-h-[60vh] max-w-full object-contain">
            </div>

            <div class="mt-4 text-center">
                <h4 id="lightboxTitle" class="text-white text-sm font-semibold">Logo Preview</h4>
            </div>
        </div>
    </div>

    <!-- JavaScript Logic -->
    <script>
        function switchView(mode) {
            const sideContainer = document.getElementById('view-side-container');
            const opt1Container = document.getElementById('view-opt1-container');
            const opt2Container = document.getElementById('view-opt2-container');

            const btnSide = document.getElementById('view-btn-side');
            const btnOpt1 = document.getElementById('view-btn-opt1');
            const btnOpt2 = document.getElementById('view-btn-opt2');

            // Hide all
            sideContainer.classList.add('hidden');
            opt1Container.classList.add('hidden');
            opt2Container.classList.add('hidden');

            const activeBtnClass = "px-3.5 py-1.5 rounded-lg text-xs font-semibold transition bg-white text-slate-800 shadow-sm";
            const inactiveBtnClass = "px-3.5 py-1.5 rounded-lg text-xs font-semibold text-slate-600 hover:text-slate-900 transition";

            btnSide.className = inactiveBtnClass;
            btnOpt1.className = inactiveBtnClass;
            btnOpt2.className = inactiveBtnClass;

            if (mode === 'side') {
                sideContainer.classList.remove('hidden');
                btnSide.className = activeBtnClass;
            } else if (mode === 'opt1') {
                opt1Container.classList.remove('hidden');
                btnOpt1.className = activeBtnClass;
            } else if (mode === 'opt2') {
                opt2Container.classList.remove('hidden');
                btnOpt2.className = activeBtnClass;
            }
        }

        function openLightbox(imageSrc, title, bgClass) {
            const modal = document.getElementById('lightboxModal');
            const img = document.getElementById('lightboxImg');
            const titleEl = document.getElementById('lightboxTitle');
            const stage = document.getElementById('lightboxStage');

            stage.className = "w-full p-12 sm:p-20 rounded-2xl flex items-center justify-center shadow-2xl border border-white/10 min-h-[300px] transition-all " + bgClass;

            img.src = imageSrc;
            titleEl.innerText = title;

            modal.classList.remove('hidden');
        }

        function closeLightbox() {
            document.getElementById('lightboxModal').classList.add('hidden');
        }

        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape') {
                closeLightbox();
            }
        });
    </script>
</body>
</html>
