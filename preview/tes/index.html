<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Real-ESRGAN Upscaler</title>
<style>
  :root {
    color-scheme: light;
    --bg: #f5f6f8; --card: #ffffff; --text: #1b1f27; --muted: #667085;
    --line: #dfe3ea; --accent: #4f46e5; --accent-text: #ffffff;
    --ok: #12795a; --err: #b42318; --field: #f9fafb;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --bg: #12141a; --card: #1b1e27; --text: #e8eaf0; --muted: #98a2b3;
      --line: #2d3240; --accent: #818cf8; --accent-text: #12141a;
      --ok: #4ade80; --err: #f87171; --field: #151821;
    }
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body { margin: 0; background: var(--bg); color: var(--text);
    font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  header { max-width: 1100px; margin: 0 auto; padding: 28px 20px 8px; display: flex;
    align-items: baseline; gap: 12px; flex-wrap: wrap; }
  h1 { margin: 0; font-size: 22px; }
  .badge { font-size: 12px; padding: 2px 10px; border-radius: 99px; border: 1px solid var(--line);
    color: var(--muted); }
  main { max-width: 1100px; margin: 0 auto; padding: 12px 20px 40px; display: grid;
    grid-template-columns: 1fr 1fr; gap: 20px; }
  @media (max-width: 800px) { main { grid-template-columns: 1fr; } }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 18px;
    display: flex; flex-direction: column; gap: 14px; min-width: 0; }
  h2 { margin: 0; font-size: 14px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); }

  .drop { border: 2px dashed var(--line); border-radius: 12px; min-height: 200px; display: grid;
    place-items: center; text-align: center; color: var(--muted); cursor: pointer; overflow: hidden;
    background: var(--field); transition: border-color .15s; }
  .drop.over, .drop:hover { border-color: var(--accent); }
  .drop img { max-width: 100%; max-height: 320px; display: block; }
  .meta { font-size: 13px; color: var(--muted); margin-top: -6px; }

  .field { display: flex; flex-direction: column; gap: 5px; }
  .lbl { display: flex; justify-content: space-between; align-items: center; font-weight: 600; font-size: 14px; }
  .lbl .val { font-weight: 500; color: var(--accent); font-variant-numeric: tabular-nums; }
  .tip { display: inline-grid; place-items: center; width: 16px; height: 16px; margin-left: 6px;
    border-radius: 50%; border: 1px solid var(--muted); color: var(--muted); font-size: 11px;
    font-weight: 600; cursor: help; }
  .help { font-size: 12.5px; color: var(--muted); }
  select, input[type=range] { width: 100%; }
  select { padding: 9px 10px; border-radius: 8px; border: 1px solid var(--line);
    background: var(--field); color: var(--text); font: inherit; }
  input[type=range] { accent-color: var(--accent); }
  .check { display: flex; gap: 10px; align-items: flex-start; }
  .check input { margin-top: 4px; accent-color: var(--accent); }
  .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }

  button.primary { background: var(--accent); color: var(--accent-text); border: 0; border-radius: 10px;
    padding: 13px; font: inherit; font-weight: 700; cursor: pointer; }
  button.primary:disabled { opacity: .55; cursor: progress; }
  a.btn { display: inline-block; text-align: center; padding: 10px 14px; border-radius: 10px;
    border: 1px solid var(--line); color: var(--text); text-decoration: none; font-weight: 600; }

  .stage { border: 1px solid var(--line); border-radius: 12px; background: var(--field);
    min-height: 260px; display: grid; place-items: center; color: var(--muted); overflow: hidden; }
  .cmp { position: relative; width: 100%; user-select: none; --p: 50%; }
  .cmp img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; }
  .cmp #imgIn { image-rendering: pixelated; clip-path: inset(0 calc(100% - var(--p)) 0 0); }
  .cmp .line { position: absolute; top: 0; bottom: 0; left: var(--p); width: 2px; margin-left: -1px;
    background: var(--accent); pointer-events: none; }
  .cmp input { position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0; cursor: ew-resize; margin: 0; }
  .tag { position: absolute; top: 8px; font-size: 11px; padding: 2px 8px; border-radius: 99px;
    background: rgba(0,0,0,.6); color: #fff; pointer-events: none; }
  pre#status { margin: 0; white-space: pre-wrap; word-break: break-word; font: 13px/1.55 ui-monospace,
    SFMono-Regular, Menlo, Consolas, monospace; background: var(--field); border: 1px solid var(--line);
    border-radius: 10px; padding: 12px; min-height: 96px; color: var(--muted); }
  pre#status.ok { color: var(--ok); } pre#status.err { color: var(--err); }
</style>
</head>
<body>
<header>
  <h1>🖼️ Real-ESRGAN Upscaler</h1>
  <span class="badge" id="dev">menghubungkan…</span>
</header>

<main>
  <!-- Kolom kiri: input + kontrol -->
  <section class="card">
    <h2>Input</h2>
    <div class="drop" id="drop" tabindex="0">
      <div id="dropText">Seret gambar ke sini atau klik untuk memilih</div>
      <img id="preview" alt="Pratinjau input" hidden>
    </div>
    <input type="file" id="file" accept="image/*" hidden>
    <div class="meta" id="inMeta"></div>

    <div class="field">
      <div class="lbl"><span>Model<span class="tip" title="Pilih model sesuai jenis gambar: foto, anime, dll.">?</span></span></div>
      <select id="model"></select>
    </div>

    <div class="field">
      <div class="lbl"><span>Skala output<span class="tip" title="Skala akhir bebas 0.5–8. Model melakukan upscale native dulu, lalu di-resize LANCZOS4 ke target.">?</span></span>
        <span class="val" id="outscaleV">4.0×</span></div>
      <input type="range" id="outscale" min="0.5" max="8" step="0.1" value="4">
    </div>

    <div class="field" id="denoiseRow" hidden>
      <div class="lbl"><span>Denoise strength<span class="tip" title="0 = pertahankan noise/detail, 1 = denoise kuat. Hanya untuk realesr-general-x4v3.">?</span></span>
        <span class="val" id="denoiseV">0.50</span></div>
      <input type="range" id="denoise" min="0" max="1" step="0.05" value="0.5">
    </div>

    <label class="check" id="faceRow" title="Perbaiki wajah dengan GFPGAN. Hanya untuk RealESRGAN_x4plus.">
      <input type="checkbox" id="face">
      <span><b>Face enhance (GFPGAN)</b><br><span class="help">Perbaiki wajah; hanya untuk RealESRGAN_x4plus.</span></span>
    </label>

    <div class="row2">
      <div class="field">
        <div class="lbl"><span>Tile<span class="tip" title="0 = nonaktif (butuh VRAM besar). Nilai kecil menghemat VRAM tetapi lebih lambat.">?</span></span></div>
        <select id="tile">
          <option value="0">0 (nonaktif)</option><option value="128">128</option>
          <option value="256">256</option><option value="400" selected>400</option><option value="512">512</option>
        </select>
      </div>
      <div class="field">
        <div class="lbl"><span>Tile pad<span class="tip" title="Padding antar-tile untuk mengurangi garis sambungan. Default 10.">?</span></span>
          <span class="val" id="padV">10</span></div>
        <input type="range" id="pad" min="0" max="64" step="1" value="10">
      </div>
    </div>

    <label class="check" title="Tidak dicentang = fp16 (lebih cepat, hemat VRAM). Centang jika hasil berartefak atau hitam.">
      <input type="checkbox" id="fp32">
      <span><b>Gunakan fp32 (presisi penuh)</b><br><span class="help">Lebih lambat dan boros VRAM, tapi paling stabil.</span></span>
    </label>

    <button class="primary" id="run" disabled>Mulai Pemrosesan</button>
  </section>

  <!-- Kolom kanan: output + status -->
  <section class="card">
    <h2>Hasil</h2>
    <div class="stage" id="stage">
      <span id="empty">Hasil akan tampil di sini</span>
      <div class="cmp" id="cmp" hidden>
        <img id="imgOut" alt="Hasil upscale">
        <img id="imgIn" alt="Gambar asli">
        <span class="tag" style="left:8px">Asli</span>
        <span class="tag" style="right:8px">Hasil</span>
        <div class="line"></div>
        <input type="range" id="split" min="0" max="100" value="50" aria-label="Geser untuk membandingkan">
      </div>
    </div>
    <a class="btn" id="dl" hidden>⬇ Unduh PNG</a>
    <div class="field">
      <div class="lbl"><span>Status</span></div>
      <pre id="status">Status proses akan tampil di sini.</pre>
    </div>
  </section>
</main>

<script>
  // Dibuka lewat file:// -> arahkan ke server lokal; dibuka via server -> pakai origin yang sama.
  const API = location.protocol === 'file:' ? 'http://127.0.0.1:8000' : '';
  const $ = id => document.getElementById(id);
  let meta = null, file = null, origURL = null, timer = null;

  function setStatus(text, cls) { const s = $('status'); s.textContent = text; s.className = cls || ''; }

  // Tampilkan kontrol khusus model (setara gr.update(visible=...) di versi Gradio)
  function syncVisibility() {
    if (!meta) return;
    $('denoiseRow').hidden = $('model').value !== meta.general_key;
    $('faceRow').hidden = $('model').value !== meta.face_key;
  }

  async function init() {
    try {
      meta = await (await fetch(API + '/api/models')).json();
      $('model').innerHTML = meta.models.map(m => `<option value="${m.key}">${m.label}</option>`).join('');
      $('model').value = meta.default;
      $('dev').textContent = meta.cuda ? 'GPU (CUDA)' : 'CPU: proses lambat';
      syncVisibility();
    } catch (e) {
      $('dev').textContent = 'server tidak terhubung';
      setStatus('❌ Tidak bisa terhubung ke server. Jalankan "python server.py" lalu buka http://127.0.0.1:8000', 'err');
    }
  }

  // Slider -> tampilkan nilainya
  const bind = (id, out, fmt) => $(id).addEventListener('input', () => $(out).textContent = fmt($(id).value));
  bind('outscale', 'outscaleV', v => (+v).toFixed(1) + '×');
  bind('denoise', 'denoiseV', v => (+v).toFixed(2));
  bind('pad', 'padV', v => v);
  $('model').addEventListener('change', syncVisibility);

  // Unggah: klik, seret-lepas, atau tempel (Ctrl+V)
  function setFile(f) {
    if (!f || !f.type.startsWith('image/')) { setStatus('⚠️ File harus berupa gambar.', 'err'); return; }
    file = f;
    if (origURL) URL.revokeObjectURL(origURL);
    origURL = URL.createObjectURL(f);
    const img = $('preview');
    img.onload = () => $('inMeta').textContent = `${f.name} · ${img.naturalWidth}×${img.naturalHeight} · ${(f.size / 1024).toFixed(0)} KB`;
    img.src = origURL; img.hidden = false; $('dropText').hidden = true;
    $('run').disabled = !meta;
  }
  $('drop').addEventListener('click', () => $('file').click());
  $('drop').addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') $('file').click(); });
  $('file').addEventListener('change', e => setFile(e.target.files[0]));
  ['dragenter', 'dragover'].forEach(t => $('drop').addEventListener(t, e => { e.preventDefault(); $('drop').classList.add('over'); }));
  ['dragleave', 'drop'].forEach(t => $('drop').addEventListener(t, e => { e.preventDefault(); $('drop').classList.remove('over'); }));
  $('drop').addEventListener('drop', e => setFile(e.dataTransfer.files[0]));
  document.addEventListener('paste', e => { const f = [...e.clipboardData.files][0]; if (f) setFile(f); });

  // Slider perbandingan asli vs hasil
  $('split').addEventListener('input', e => $('cmp').style.setProperty('--p', e.target.value + '%'));

  $('run').addEventListener('click', async () => {
    if (!file) { setStatus('⚠️ Belum ada gambar. Unggah gambar terlebih dahulu.', 'err'); return; }
    const fd = new FormData();
    fd.append('file', file);
    fd.append('model', $('model').value);
    fd.append('outscale', $('outscale').value);
    fd.append('tile', $('tile').value);
    fd.append('tile_pad', $('pad').value);
    fd.append('fp32', $('fp32').checked);
    fd.append('denoise', $('denoise').value);
    fd.append('face', $('face').checked);

    $('run').disabled = true;
    const t0 = Date.now();
    timer = setInterval(() => setStatus(`⏳ Memproses… ${((Date.now() - t0) / 1000).toFixed(0)} dtk\n(Pemakaian pertama bisa lama karena bobot model diunduh.)`), 500);
    try {
      const res = await fetch(API + '/api/upscale', { method: 'POST', body: fd });
      const data = await res.json();
      clearInterval(timer);
      setStatus(data.status, data.ok ? 'ok' : 'err');
      if (data.ok) showResult(data.image);
    } catch (e) {
      clearInterval(timer);
      setStatus('❌ Gagal menghubungi server: ' + e.message, 'err');
    } finally { $('run').disabled = false; }
  });

  function showResult(src) {
    const out = $('imgOut');
    out.onload = () => {
      // Samakan rasio kotak dengan hasil; gambar asli diregangkan agar jelas bedanya
      $('cmp').style.aspectRatio = out.naturalWidth + ' / ' + out.naturalHeight;
      $('cmp').hidden = false; $('empty').hidden = true;
    };
    out.src = src;
    $('imgIn').src = origURL;
    const base = file.name.replace(/\.[^.]+$/, '');
    $('dl').href = src; $('dl').download = `${base}_x${$('outscale').value}.png`; $('dl').hidden = false;
  }

  init();
</script>
</body>
</html>
