<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PDF Viewer with Thumbnails</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            display: flex;
            height: 100vh;
            font-family: Arial, sans-serif;
            background: #1a1a2e;
        }

        .sidebar {
            width: 200px;
            background: #16213e;
            padding: 20px 10px;
            overflow-y: auto;
            border-right: 2px solid #0f3460;
        }

        .sidebar h3 {
            color: #e94560;
            text-align: center;
            margin-bottom: 15px;
        }

        .thumbnail {
            width: 100%;
            margin-bottom: 10px;
            cursor: pointer;
            border: 2px solid transparent;
            transition: 0.3s;
            border-radius: 4px;
        }

        .thumbnail:hover {
            border-color: #e94560;
            transform: scale(1.02);
        }

        .thumbnail.active {
            border-color: #4CAF50;
        }

        .main {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: #0f3460;
        }

        .toolbar {
            padding: 15px;
            background: #16213e;
            display: flex;
            justify-content: center;
            gap: 15px;
            align-items: center;
            border-bottom: 2px solid #0f3460;
        }

        .toolbar button {
            padding: 8px 20px;
            background: #e94560;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
        }

        .toolbar button:hover {
            background: #c73652;
        }

        .toolbar span {
            color: white;
        }

        .canvas-container {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        #pdf-viewer {
            max-width: 100%;
            max-height: 100%;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
            background: white;
        }

        input[type="number"] {
            width: 60px;
            padding: 5px;
            text-align: center;
            border-radius: 4px;
            border: none;
        }
    </style>
</head>

<body>
    <div class="sidebar">
        <h3>📄 Thumbnails</h3>
        <div id="thumbnails"></div>
    </div>
    <div class="main">
        <div class="toolbar">
            <button onclick="prevPage()">◀</button>
            <span>
                Page <input type="number" id="pageInput" value="1" min="1" onchange="goToPage()">
                of <span id="totalPages">0</span>
            </span>
            <button onclick="nextPage()">▶</button>
        </div>
        <div class="canvas-container">
            <canvas id="pdf-viewer"></canvas>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <script>
        const pdfUrl = 'faturahman.pdf';
        let pdfDoc = null;
        let currentPage = 1;
        const canvas = document.getElementById('pdf-viewer');
        const ctx = canvas.getContext('2d');

        pdfjsLib.getDocument(pdfUrl).promise.then(function (pdf) {
            pdfDoc = pdf;
            document.getElementById('totalPages').textContent = pdf.numPages;
            renderPage(currentPage);
            renderThumbnails();
        });

        function renderPage(num) {
            if (!pdfDoc) return;
            pdfDoc.getPage(num).then(function (page) {
                const viewport = page.getViewport({ scale: 1.2 });
                canvas.width = viewport.width;
                canvas.height = viewport.height;
                page.render({ canvasContext: ctx, viewport: viewport });
                document.getElementById('pageInput').value = num;
                currentPage = num;
                updateActiveThumbnail(num);
            });
        }

        function renderThumbnails() {
            const container = document.getElementById('thumbnails');
            for (let i = 1; i <= pdfDoc.numPages; i++) {
                const thumb = document.createElement('canvas');
                thumb.className = 'thumbnail';
                thumb.dataset.page = i;

                pdfDoc.getPage(i).then(function (page) {
                    const vp = page.getViewport({ scale: 0.3 });
                    thumb.width = vp.width;
                    thumb.height = vp.height;
                    page.render({ canvasContext: thumb.getContext('2d'), viewport: vp });
                });

                thumb.addEventListener('click', function () {
                    renderPage(i);
                });
                container.appendChild(thumb);
            }
        }

        function updateActiveThumbnail(pageNum) {
            document.querySelectorAll('.thumbnail').forEach(el => {
                el.classList.toggle('active', parseInt(el.dataset.page) === pageNum);
            });
        }

        function nextPage() {
            if (pdfDoc && currentPage < pdfDoc.numPages) renderPage(currentPage + 1);
        }
        function prevPage() {
            if (currentPage > 1) renderPage(currentPage - 1);
        }
        function goToPage() {
            const input = document.getElementById('pageInput');
            let page = parseInt(input.value);
            if (pdfDoc && page >= 1 && page <= pdfDoc.numPages) renderPage(page);
            else input.value = currentPage;
        }

        document.addEventListener('keydown', e => {
            if (e.key === 'ArrowRight' || e.key === 'ArrowDown') nextPage();
            if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') prevPage();
        });
    </script>
</body>

</html>
